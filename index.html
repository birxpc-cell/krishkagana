    <style>
        :root {
            --bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.9);
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --accent: #3b82f6;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.15) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 16px;
        }

        .wrapper {
            width: 100%;
            max-width: 390px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 24px;
            padding: 24px 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
        }

        /* Live Status Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1.4s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Profile Avatar */
        .avatar-wrap {
            position: relative;
            width: 115px;
            height: 115px;
            margin-top: 2px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* Title & Subtitle */
        .main-title {
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .sub-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: -6px;
            font-weight: 500;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            gap: 10px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 6px;
            border-radius: 12px;
        }

        .stat-val {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Action Button */
        .cta-box {
            width: 100%;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 20px;
            background: linear-gradient(135deg, #00f0ff 0%, #3b82f6 100%);
            color: #030712;
            font-size: 18px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 0 25px var(--primary-glow);
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 240, 255, 0.7); }
        }

        /* Timer Card */
        .timer-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-text {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .timer-clock {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            font-family: monospace;
        }

        /* Footer */
        .footer {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Timer Script -->
    <script>
        var timeLeft = 15;
        var timerDisplay = document.getElementById('timer');
        var countdown = setInterval(function() {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.innerText = "00:00";
            } else {
                timeLeft--;
                timerDisplay.innerText = "00:" + (timeLeft < 10 ? '0' + timeLeft : timeLeft);
            }
        }, 1000);
